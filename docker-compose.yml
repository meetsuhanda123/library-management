services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb+srv://pranavramesh5005_db_user:4qreTSxP2zuPL75Z@cluster0.qnqldi6.mongodb.net/libraryDB}
      - CLIENT_URL=http://localhost:5273,http://localhost:5173,http://localhost:80
      - JWT_SECRET=${JWT_SECRET:-super_secret_library_hub_jwt_key_2026_secure}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-noreply@libraryhub.local}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-LibraryHub Notifications}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - library-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: library-frontend
    restart: unless-stopped
    ports:
      - "5273:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - library-network

networks:
  library-network:
    driver: bridge
